- title: "School on Nonlinear Dynamics, Complex Networks, Information Theory and Machine Learning in Neuroscience"
  subtitle: ""
  date: "May. 2023"
  type: "Description"
  content: "A one week workshop organized by ICTP-SAIFR on São Paulo, focused on. From the <a href='https://www.ictp-saifr.org/nld2023/'> official website</a>: This school for PhD students and young postdocs will focus on five main areas: nonlinear dynamics, complex networks, data analysis, information theory and machine learning. The school will cover fundamental and applied aspects such as excitability and neuronal dynamics, neural coding, entropy and complexity measures, machine learning and data analysis methods for inferring functional connectivity, methods for characterizing functional networks, etc."
