- date: "2025-08-29"
  title: "New publication: Discovering equations from data: symbolic regression in dynamical systems"
  content: "We present a historical discussion and benchmark the state-of-the-art algorithms tackling how symbolic regression can be used to infer the governing equations of several dynamic systems automatically, and still benefit from in-domain knowledge."
