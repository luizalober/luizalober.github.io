- date: "2026-11-18"
  title: "New publication: Network sampling: a compartive review"
  content: "Can a network sample preserve what we need to know about the whole network? For large networks, observing every connection may be impractical. Sampling allows us to study a smaller portion of the structure, but raises a key question: how does the sampling method affect our conclusions about the original network? In our new paper, “Network sampling: a comparative review,” we compare sampling methods on synthetic and real-world networks, combining network measures, multivariate statistical analysis, and machine learning. Our findings highlight why choosing a sampling strategy is an integral part of network analysis: it influences which structural features we recover and how we interpret the data."
  link: "https://www.linkedin.com/feed/update/urn:li:activity:7528472294046982144/"
  type: "linkedin"

- date: "2025-08-29"
  title: "New publication: Discovering equations from data: symbolic regression in dynamical systems"
  content: "We present a historical discussion and benchmark the state-of-the-art algorithms tackling how symbolic regression can be used to infer the governing equations of several dynamic systems automatically, and still benefit from in-domain knowledge."
  link: "https://bsky.app/profile/franciscorodrigues.bsky.social/post/3lxkt6m3e6c2f"
  type: "bluesky"

- date: "2024-11-29"
  title: "New publication: Predictive Non-linear Dynamics via Neural Networks and Recurrence Plots"
  content: "Is it possible to predict chaotic dynamics? In this new paper, we use recurrence plots to train convolutional neural networks with the task of estimating the defining control parameters of non-linear systems."
