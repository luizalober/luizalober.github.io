- date: "2024-11-29"
  title: "New publication: Predictive Non-linear Dynamics via Neural Networks and Recurrence Plots"
  content: "Is it possible to predict chaotic dynamics? In this new paper, we use recurrence plots to train convolutional neural networks with the task of estimating the defining control parameters of non-linear systems."
